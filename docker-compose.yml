services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull '${OLLAMA_MODEL:-gemma3:4b}'"]
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      YTDLP_PATH: /opt/yt-dlp/bin/yt-dlp
      FFMPEG_PATH: /usr/bin/ffmpeg
      WHISPER_CPP_PATH: /opt/whisper/build/bin/whisper-cli
      WHISPER_MODEL_PATH: /opt/whisper/models/ggml-base.bin
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - bot_auth:/app/auth_info
      - bot_data:/app/data
      - bot_downloads:/app/downloads
    restart: unless-stopped

volumes:
  ollama_models:
  bot_auth:
  bot_data:
  bot_downloads:
